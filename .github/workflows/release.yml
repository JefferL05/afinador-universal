name: Release

# Dispara ao criar uma tag v* (ex.: v1.0.0). Uma tag imutavel amarra o
# artefato assinado a um commit especifico - sem isso, "o APK que mandei para a
# loja" nao tem relacao verificavel com "o codigo na main".
on:
  push:
    tags: [ 'v*' ]
  # Disparo manual: permite gerar a release sem criar uma tag, o que é o
  # caminho de teste antes de cortar versão. Uma tag que não sai é fácil de
  # apagar; uma release publicada, não.
  workflow_dispatch:

# Uma release por vez. Duas execuções concorrentes brigariam pela mesma pasta
# de cache do Gradle e pelo mesmo nome de artefato.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Conferir segredos
        # Falhar aqui, no primeiro minuto, e muito melhor do que falhar
        # depois de 20 minutos de build por causa de um segredo nao configurado.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Segredo ausente: $v"
              exit 1
            fi
          done
          echo "Todos os segredos de assinatura estao configurados."

      - name: Decodificar keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/afinador.jks"

          # Confere a senha antes de compilar: um erro de senha aqui e
          # imediato, o mesmo erro durante o build chega 15 minutos depois.
          keytool -list -keystore "$RUNNER_TEMP/afinador.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/afinador.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties escrito."

      - name: Preflight
        shell: pwsh
        run: ./tools/preflight.ps1

      - name: Testes
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK e AAB assinados
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Conferir a assinatura
        # Um APK sem assinatura instala em debug e e rejeitado pela loja.
        # Verificar aqui evita descobrir isso no upload.
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK assinado nao encontrado"; exit 1; }

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner nao encontrado"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          echo "Assinatura verificada."

      - name: Checksums
        id: checksums
        run: |
          set -euo pipefail
          cd app/build/outputs
          sha256sum apk/release/*.apk bundle/release/*.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # O corpo da release NAO roda shell: `$(cat ...)` sairia literal no
          # texto publicado. O conteúdo tem de viajar pelo output do passo.
          {
            echo 'checksums<<EOF_CHECKSUMS'
            cat SHA256SUMS.txt
            echo 'EOF_CHECKSUMS'
          } >> "$GITHUB_OUTPUT"

      - name: Mapa de ofuscacao
        # Sem o mapping.txt, um crashReport do release nao pode ser
        # desofuscado e o Play Console mostra so "classe A". E a diferenca entre
        # corrigir um bug em um dia e em um mes.
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 365

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Checksums

            ```
            ${{ steps.checksums.outputs.checksums }}
            ```

            ## Para subir na Play Store

            O arquivo `.aab` e o que vai para o upload. O `.apk` serve para
            instalar manualmente e testar antes de publicar.

            ## Se precisar depurar um crash

            O artefato `mapping` tem o `mapping.txt` do R8. Sem ele, stack
            traces do release sao ilegiveis.