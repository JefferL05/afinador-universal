name: CI

# `master`, e nao `main`: e o nome da branch deste repositorio. Com `main` a
# CI ficaria verde por nunca ter rodado — nenhuma execucao, nenhuma falha.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

# Um build por vez. A fila evita que dois pushes disparem builds concorrentes
# lutando pela mesma pasta de cache do Gradle, o que causa falha de lock.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    # Portão de segundos, antes de gastar minutos de build.
    # pwsh vem instalado nas runners ubuntu-latest, então o mesmo script roda
    # aqui e na máquina do desenvolvedor.
    name: Verificações estáticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        shell: pwsh
        run: ./tools/preflight.ps1

  build:
    name: Build e testes
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 é obrigatório: o AGP 8.x recusa versões anteriores, e a falha
          # aparece como erro críptico de compilação de script, não de JDK.
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache dos jars do Robolectric
        # O Robolectric baixa os "android-all" na primeira execução de cada
        # versão de SDK. Sem este cache, o primeiro build de cada CI gasta
        # minutos baixando ~100 MB.
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        # Só interrompe por erro. Aviso de lint é informação; erro é defeito.
        run: ./gradlew lintDebug --stacktrace

      - name: APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          retention-days: 7

      - name: Relatório de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-lint
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: afinador-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release-readiness:
    # Build de release sem assinar. É aqui que o R8 roda e onde o
    # minificador quebra coisas que o build de debug nunca tocaria.
    name: Release sem assinatura
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Minificar
        # Sem keystore.properties, o build.gradle não aplica assinatura e gera
        # um APK release "unsigned" — exatamente o que se quer testar.
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Conferir que o minificador rodou
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK" || { echo "APK de release nao encontrado"; exit 1; }
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "AAB nao encontrado"; exit 1; }
          echo "APK: $(du -h "$APK" | cut -f1)"
          echo "AAB: $(du -h "$AAB" | cut -f1)"

      - name: Tamanho do APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((30 * 1024 * 1024))
          echo "APK_unsigned com $BYTES bytes (limite: $LIMIT)"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "APK acima do limite de 30 MB"; exit 1
          fi

      - name: Artefatos de release
        uses: actions/upload-artifact@v4
        with:
          name: afinador-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14